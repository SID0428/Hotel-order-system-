<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — CS Triplet Eatery</title>
  <meta name="description" content="Admin dashboard for CS Triplet Eatery. Manage orders and track status." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <!-- Top Nav -->
  <nav class="admin-nav">
    <div class="admin-nav__left">
      <div class="admin-nav__logo">CS<span>Triplet</span></div>
      <span class="admin-nav__badge">Admin</span>
    </div>
    <div class="admin-nav__right">
      <a href="/" class="admin-nav__link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Storefront
      </a>
      <button class="admin-nav__refresh" id="refresh-btn" onclick="loadOrders()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        Refresh
      </button>
    </div>
  </nav>

  <!-- Stats Row -->
  <div class="admin-container">
    <div class="admin-stats" id="admin-stats">
      <div class="stat-card">
        <span class="stat-card__value" id="stat-total">0</span>
        <span class="stat-card__label">Total Orders</span>
      </div>
      <div class="stat-card stat-card--pending">
        <span class="stat-card__value" id="stat-pending">0</span>
        <span class="stat-card__label">Pending</span>
      </div>
      <div class="stat-card stat-card--preparing">
        <span class="stat-card__value" id="stat-preparing">0</span>
        <span class="stat-card__label">Preparing</span>
      </div>
      <div class="stat-card stat-card--ready">
        <span class="stat-card__value" id="stat-ready">0</span>
        <span class="stat-card__label">Ready</span>
      </div>
      <div class="stat-card stat-card--revenue">
        <span class="stat-card__value" id="stat-revenue">₹0</span>
        <span class="stat-card__label">Revenue</span>
      </div>
    </div>

    <!-- Filter Tabs -->
    <div class="admin-filters">
      <button class="filter-tab active" data-filter="all" onclick="filterOrders('all', this)">All</button>
      <button class="filter-tab" data-filter="pending" onclick="filterOrders('pending', this)">Pending</button>
      <button class="filter-tab" data-filter="preparing" onclick="filterOrders('preparing', this)">Preparing</button>
      <button class="filter-tab" data-filter="ready" onclick="filterOrders('ready', this)">Ready</button>
      <button class="filter-tab" data-filter="completed" onclick="filterOrders('completed', this)">Completed</button>
    </div>

    <!-- Orders List -->
    <div id="orders-list" class="orders-list">
      <div class="orders-empty">
        <p>Loading orders...</p>
      </div>
    </div>
  </div>

  <!-- Order Detail Drawer -->
  <div id="drawer-overlay" class="drawer-overlay" onclick="closeDrawer()"></div>
  <div id="order-drawer" class="order-drawer">
    <div class="drawer-header">
      <h3 id="drawer-title">Order #000</h3>
      <button class="drawer-close" onclick="closeDrawer()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
